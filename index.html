    /* ═══════════════════════════════════════════
       MAIN GAME
       ═══════════════════════════════════════════ */
    function TheHole() {
      const containerRef = useRef(null);
      const [dims, setDims] = useState({ w: 400, h: 700 });
      const [gameState, setGameState] = useState("menu");
      const [gameMode, setGameMode] = useState("classic");
      const [lang, setLang] = useState(detectLanguage);
      const [hoveredBtn, setHoveredBtn] = useState(null);
      const [lineLabel, setLineLabel] = useState(""); // "LINE 1/3" or "BONUS"
      const [allLines, setAllLines] = useState([]); // all line targets for current round
      const [completedLines, setCompletedLines] = useState([]); // indices of completed lines
      const [visibleDots, setVisibleDots] = useState(1); // how many dots shown so far
      const [totalRound, setTotalRound] = useState(0);
      const [score, setScore] = useState(0);
      const [dotAngle, setDotAngle] = useState(0);
      const [lineTarget, setLineTarget] = useState(null);
      const [lineProgress, setLineProgress] = useState(0);
      const [lineFade, setLineFade] = useState(1);
      const [dragPath, setDragPath] = useState([]);
      const [isDragging, setIsDragging] = useState(false);
      const [timeLeft, setTimeLeft] = useState(3);
      const [showLine, setShowLine] = useState(false);
      const [holeRadius, setHoleRadius] = useState(15);
      const [feedback, setFeedback] = useState("");
      const [dotPulse, setDotPulse] = useState(0);
      const [shakeLevel, setShakeLevel] = useState(0);
      const [attemptDone, setAttemptDone] = useState(false);
      const [playerName, setPlayerName] = useState("");
      const [submitStatus, setSubmitStatus] = useState("");
      const [milestone, setMilestone] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [showTutorial, setShowTutorial] = useState(false);
      const [rulesTab, setRulesTab] = useState("classic");
      const [showPortal, setShowPortal] = useState(false);
      const [portalBonusCount, setPortalBonusCount] = useState(0);
      const [scoreBreakdown, setScoreBreakdown] = useState([]);
      const [isOnline, setIsOnline] = useState(null); // null=unchecked
      const [nameShake, setNameShake] = useState(false);
      const [qualifiesForBoard, setQualifiesForBoard] = useState(false);
      const hasFailedOnce = useRef(false);

      const timerRef = useRef(null);
      const lineAnimRef = useRef(null);
      const fadeAnimRef = useRef(null);
      const levelStartTime = useRef(0);
      const internalScore = useRef(0);
      const attemptDoneRef = useRef(false);
      const isDraggingRef = useRef(false);
      const showLineRef = useRef(false);
      const dragPathRef = useRef([]);
      const gameStateRef = useRef("menu");
      const roundLog = useRef([]);
      const roundSetupRef = useRef(null);
      const submittingRef = useRef(false);
      const startLevelRef = useRef(null);
      const lineTargetsRef = useRef([]);
      const currentLineIdxRef = useRef(0);
      const roundScoreAccum = useRef(0);
      const completedLinesRef = useRef([]);
      const timerStartedRef = useRef(false);
      const [timerStarted, setTimerStarted] = useState(false);
      const visibleDotsRef = useRef(1);
      const advanceTimeoutRef = useRef(null);

      // Checkpoint system: saves at each multiplier milestone
      const [checkpoint, setCheckpoint] = useState(null);
      const [retriesLeft, setRetriesLeft] = useState(3);
      const totalAccHits = useRef(0);
      const totalAccAttempts = useRef(0);

      useEffect(() => {
        const measure = () => {
          if (containerRef.current)
            setDims({ w: containerRef.current.clientWidth, h: containerRef.current.clientHeight });
        };
        measure();
        window.addEventListener("resize", measure);
        return () => window.removeEventListener("resize", measure);
      }, []);

      // Pause audio and game when screen sleeps / tab hidden
      useEffect(() => {
        const onVisibility = () => {
          if (document.hidden) {
            if (AudioEngine.ctx && AudioEngine.ctx.state === 'running') {
              AudioEngine.ctx.suspend();
            }
            AudioEngine.stopLaser();
            clearInterval(timerRef.current);
            clearTimeout(advanceTimeoutRef.current);
            cancelAnimationFrame(lineAnimRef.current);
            cancelAnimationFrame(fadeAnimRef.current);
            // if mid-drag, end the attempt (can't pause a reflex game)
            if (isDraggingRef.current && !attemptDoneRef.current) {
              finishAttempt(dragPathRef.current);
            }
          } else {
            if (AudioEngine.ctx && AudioEngine.ctx.state === 'suspended') {
              AudioEngine.ctx.resume();
            }
          }
        };
        document.addEventListener('visibilitychange', onVisibility);
        return () => document.removeEventListener('visibilitychange', onVisibility);
      }, [finishAttempt]);

      // Sync gameState ref for native event handlers
      useEffect(() => { gameStateRef.current = gameState; }, [gameState]);

      useEffect(() => {
        let frame;
        const tick = () => {
          // sync to ambient LFO at 0.5Hz — same phase as the wumm
          const t = AudioEngine.ctx ? AudioEngine.ctx.currentTime : Date.now() / 1000;
          const pulse = Math.sin(t * Math.PI) * 0.5 + 0.5; // 0.5Hz = π rad/s
          setDotPulse(pulse);
          frame = requestAnimationFrame(tick);
        };
        if (gameState === "playing" && !showLine) tick();
        return () => cancelAnimationFrame(frame);
      }, [gameState, showLine]);

      const cx = dims.w / 2;
      const cy = dims.h / 2;
      const circleR = Math.min(dims.w, dims.h) * 0.12;
      const maxHoleDim = Math.min(dims.w, dims.h) * 0.35;
      const cappedHoleRadius = Math.min(holeRadius, maxHoleDim);
      const holeCanvasSize = Math.min(Math.ceil(cappedHoleRadius * 3.5), maxHoleDim * 2.5);

      const lv = calcLevel(totalRound);
      const multiplier = getMultiplier(lv);
      const lineCount = getLineCount(gameMode, totalRound);
      const baseTime = getMaxTime(totalRound);
      // time scaling: 1=1x, 2=1.5x, 3=2x, 4=3x, 5=4x...
      const timeMult = lineCount <= 1 ? 1 : lineCount === 2 ? 1.5 : lineCount - 1;
      const maxTime = baseTime * timeMult;
      const lineLen = LINE_LENGTH_BASE + (lv.set + lv.tier * 10) * 6;

      const startLevel = useCallback(() => {
        const count = getLineCount(gameMode, totalRound);
        const targets = [];
        for (let i = 0; i < count; i++) {
          const a = Math.random() * Math.PI * 2;
          targets.push({ dotAngle: a, lineAngle: a + rand(-0.6, 0.6), lineLength: lineLen });
        }
        lineTargetsRef.current = targets;
        currentLineIdxRef.current = 0;
        completedLinesRef.current = [];
        roundScoreAccum.current = 0;
        const first = targets[0];
        setDotAngle(first.dotAngle);
        setLineTarget({ angle: first.lineAngle, length: first.lineLength });
        roundSetupRef.current = first;
        setAllLines(targets);
        setCompletedLines([]);
        setVisibleDots(1);
        visibleDotsRef.current = 1;
        setLineLabel(count > 1 ? ('1/' + count) : '');
        setLineProgress(0);
        setLineFade(1);
        setShowPortal(false);
        setPortalBonusCount(0);
        setScoreBreakdown([]);
        cancelAnimationFrame(fadeAnimRef.current);
        clearTimeout(advanceTimeoutRef.current);
        AudioEngine.stopLaser();
        setDragPath([]);
        dragPathRef.current = [];
        setShowLine(false);
        showLineRef.current = false;
        setIsDragging(false);
        isDraggingRef.current = false;
        setAttemptDone(false);
        attemptDoneRef.current = false;
        timerStartedRef.current = false;
        setTimerStarted(false);
        setTimeLeft(maxTime);
        setFeedback("");
        setShakeLevel(0);
        setGameState("playing");
        gameStateRef.current = "playing";
      }, [lineLen, maxTime, gameMode, totalRound, lv, lang]);

      // keep ref in sync so success handler always calls latest version
      useEffect(() => { startLevelRef.current = startLevel; }, [startLevel]);

      // Reset trace state after completing a line — next dot is already visible
      const advanceToNextLine = useCallback(() => {
        setLineTarget(null);
        roundSetupRef.current = null;
        setLineProgress(0);
        setLineFade(1);
        cancelAnimationFrame(fadeAnimRef.current);
        AudioEngine.stopLaser();
        setDragPath([]);
        dragPathRef.current = [];
        setShowLine(false);
        showLineRef.current = false;
        setIsDragging(false);
        isDraggingRef.current = false;
        setAttemptDone(false);
        attemptDoneRef.current = false;
        setShowPortal(false);
        setScoreBreakdown([]);
        setShakeLevel(0);
        setFeedback("");
      }, []);

      const startGame = async (mode) => {
        AudioEngine.init();
        AudioEngine.startAmbient();
        if (mode) setGameMode(mode);
        const online = await checkConnectivity();
        setIsOnline(online);
        setTotalRound(0);
        setScore(0);
        internalScore.current = 0;
        roundLog.current = [];
        setHoleRadius(15);
        setSubmitStatus("");
        submittingRef.current = false;
        setIsSubmitting(false);
        setCheckpoint(null);
        setRetriesLeft(3);
        totalAccHits.current = 0;
        totalAccAttempts.current = 0;
        setShowPortal(false);
        setLineLabel("");
        hasFailedOnce.current = false;
        // defer startLevel so state updates (especially totalRound=0) take effect
        setTimeout(() => { if (startLevelRef.current) startLevelRef.current(); }, 0);
      };

      const retryFromCheckpoint = () => {
        if (!checkpoint || retriesLeft <= 0) return;
        setTotalRound(checkpoint.round);
        setScore(checkpoint.score);
        internalScore.current = checkpoint.score;
        setHoleRadius(checkpoint.holeRadius);
        roundLog.current = roundLog.current.slice(0, checkpoint.round);
        setRetriesLeft((prev) => prev - 1);
        setTimeout(() => { if (startLevelRef.current) startLevelRef.current(); }, 0);
      };

      // countdown — starts on first tap, runs continuously through all lines
      useEffect(() => {
        if (gameState !== "playing" || !timerStarted) return;
        const start = Date.now();
        const totalMs = timeLeft * 1000;
        timerRef.current = setInterval(() => {
          const remaining = Math.max(0, totalMs - (Date.now() - start));
          setTimeLeft(remaining / 1000);
          if (remaining <= 500) setShakeLevel(2);
          else if (remaining <= 1000) setShakeLevel(1);
          else setShakeLevel(0);
          if (remaining <= 0) {
            clearInterval(timerRef.current);
            clearTimeout(advanceTimeoutRef.current);
            attemptDoneRef.current = true;
            isDraggingRef.current = false;
            AudioEngine.stopLaser();
            setAttemptDone(true);
            const totalLines = lineTargetsRef.current.length;
            const completed = completedLinesRef.current.length;
            const requiredCount = totalLines > 1 ? totalLines - 1 : totalLines;
            if (completed >= requiredCount) {
              setFeedback('');
              setShowPortal(true);
              if (roundScoreAccum.current > 0) {
                setScoreBreakdown([{ label: 'ROUND TOTAL', value: '+' + roundScoreAccum.current, color: '#fff' }]);
                AudioEngine.playScoreTick(0);
              }
              setHoleRadius((prev) => prev + Math.max(1, 4 / (1 + prev * 0.01)));
              setGameState("success");
              gameStateRef.current = "success";
              setTimeout(() => setTotalRound((p) => p + 1), 100);
            } else {
              AudioEngine.playFail();
              setFeedback("TIME'S UP");
              if (!hasFailedOnce.current) {
                hasFailedOnce.current = true;
                setShowTutorial(true);
              } else {
                setGameState("gameover");
                gameStateRef.current = "gameover";
              }
            }
          }
        }, 30);
        return () => clearInterval(timerRef.current);
      }, [gameState, timeLeft, timerStarted]);

      const dotX = cx + Math.cos(dotAngle) * circleR;
      const dotY = cy + Math.sin(dotAngle) * circleR;
      let lineEndX = dotX, lineEndY = dotY;
      if (lineTarget) {
        let rawEndX = dotX + Math.cos(lineTarget.angle) * lineTarget.length;
        let rawEndY = dotY + Math.sin(lineTarget.angle) * lineTarget.length;
        // clamp to stay 25px from edges — scale line down if needed
        const pad = 25;
        const clampedX = clamp(rawEndX, pad, dims.w - pad);
        const clampedY = clamp(rawEndY, pad, dims.h - pad);
        if (rawEndX !== clampedX || rawEndY !== clampedY) {
          // find the max t (0-1) where the line stays in bounds
          const dx = rawEndX - dotX, dy = rawEndY - dotY;
          let t = 1;
          if (dx !== 0) {
            if (rawEndX < pad) t = Math.min(t, (pad - dotX) / dx);
            if (rawEndX > dims.w - pad) t = Math.min(t, (dims.w - pad - dotX) / dx);
          }
          if (dy !== 0) {
            if (rawEndY < pad) t = Math.min(t, (pad - dotY) / dy);
            if (rawEndY > dims.h - pad) t = Math.min(t, (dims.h - pad - dotY) / dy);
          }
          t = Math.max(0.3, t); // keep at least 30% of the line
          lineEndX = dotX + dx * t;
          lineEndY = dotY + dy * t;
        } else {
          lineEndX = rawEndX;
          lineEndY = rawEndY;
        }
      }

      const evaluateDrag = useCallback((path) => {
        if (path.length < 3) return { passed: false, reason: "DRAG FURTHER!" };
        const totalLineLen = dist(dotX, dotY, lineEndX, lineEndY);
        if (totalLineLen < 1) return { passed: false, reason: "ERROR" };
        const ldx = (lineEndX - dotX) / totalLineLen;
        const ldy = (lineEndY - dotY) / totalLineLen;
        let td = 0, mp = 0;
        path.forEach((p) => {
          const dx = p.x - dotX, dy = p.y - dotY;
          const proj = dx * ldx + dy * ldy;
          const pc = clamp(proj, 0, totalLineLen);
          td += dist(p.x, p.y, dotX + ldx * pc, dotY + ldy * pc);
          mp = Math.max(mp, proj);
        });
        const avgDist = td / path.length;
        const coverage = clamp(mp / totalLineLen, 0, 1);
        const accuracy = Math.max(0, 1 - avgDist / 60);
        return { passed: coverage > 0.5 && accuracy > 0.3, coverage, accuracy };
      }, [dotX, dotY, lineEndX, lineEndY]);

      const finishAttempt = useCallback((path) => {
        if (attemptDoneRef.current) return;
        cancelAnimationFrame(lineAnimRef.current);
        cancelAnimationFrame(fadeAnimRef.current);
        attemptDoneRef.current = true;
        isDraggingRef.current = false;
        setAttemptDone(true);
        setIsDragging(false);

        const result = evaluateDrag(path);
        const totalLines = lineTargetsRef.current.length;
        const curIdx = currentLineIdxRef.current;
        const isBonusLine = curIdx === totalLines - 1 && totalLines > 1;
        const isOnlyLine = totalLines === 1;

        const endRound = () => {
          clearInterval(timerRef.current);
          setShowPortal(true);
          setHoleRadius((prev) => prev + Math.max(1, 4 / (1 + prev * 0.01)));
          setGameState("success");
          gameStateRef.current = "success";
          setTimeout(() => setTotalRound((p) => p + 1), 100);
        };

        if (result.passed) {
          AudioEngine.stopLaser();
          AudioEngine.playZap();

          const elapsed = (Date.now() - levelStartTime.current) / 1000;
          const timeRemaining = Math.max(0, maxTime - elapsed);
          const accuracyPct = Math.round(result.accuracy * 100);

          totalAccAttempts.current += 1;
          totalAccHits.current += result.accuracy;

          let accMult = 1.0;
          if (accuracyPct >= 95) accMult = 1.5;
          else if (accuracyPct >= 90) accMult = 1.4;
          else if (accuracyPct >= 85) accMult = 1.3;
          else if (accuracyPct >= 80) accMult = 1.2;
          else if (accuracyPct >= 75) accMult = 1.1;

          const baseScore = Math.round(result.accuracy * 400 + result.coverage * 200);
          const compoundMult = isBonusLine ? 1.5 : 1;
          // line streak multiplier: 1.0 first line, 1.1 second, 1.2 third, etc.
          const lineStreakMult = isOnlyLine ? 1 : 1 + completedLinesRef.current.length * 0.1;
          // time bonus only on final line of round
          const timeBonus = (isBonusLine || isOnlyLine) ? Math.round(timeRemaining * 100) : 0;
          const accBoosted = Math.round(baseScore * accMult);
          const finalScore = Math.round((accBoosted + timeBonus) * multiplier * compoundMult * lineStreakMult);

          let bonuses = 0;
          if (accMult > 1) bonuses++;
          if (timeBonus > 0) bonuses++;
          if (multiplier > 1) bonuses++;
          setPortalBonusCount(bonuses);
          // portal shows at round end only

          roundScoreAccum.current += finalScore;
          internalScore.current += finalScore;
          setScore(internalScore.current);

          if (roundSetupRef.current) {
            roundLog.current.push({
              dotAngle: roundSetupRef.current.dotAngle,
              lineAngle: roundSetupRef.current.lineAngle,
              lineLength: roundSetupRef.current.lineLength,
              dragPath: path.map(p => ({ x: Math.round(p.x * 10) / 10, y: Math.round(p.y * 10) / 10 })),
              circleR, cx, cy, elapsed,
            });
          }

          if (isOnlyLine) {
            // single line round — full breakdown
            completedLinesRef.current = [0];
            setCompletedLines([0]);
            const lines = [];
            lines.push({ label: 'BASE', value: baseScore, color: '#a855f7' });
            if (accMult > 1) lines.push({ label: 'ACCURACY ' + accuracyPct + '%', value: 'x' + accMult, color: '#ff9020' });
            if (timeBonus > 0) lines.push({ label: 'TIME', value: '+' + timeBonus, color: '#40d0ff' });
            if (multiplier > 1) lines.push({ label: 'LEVEL', value: 'x' + multiplier, color: '#ff3050' });
            lines.push({ label: 'TOTAL', value: '+' + finalScore, color: '#fff' });
            setScoreBreakdown(lines);
            lines.forEach((_, i) => setTimeout(() => AudioEngine.playScoreTick(i), i * 120));
            if (accMult > 1) setTimeout(() => AudioEngine.playAccuracyBonus(), lines.length * 120);
            setFeedback('');
            endRound();
          } else if (isBonusLine) {
            // bonus line completed — compound score, flash portal, end round
            completedLinesRef.current = [...completedLinesRef.current, curIdx];
            setCompletedLines([...completedLinesRef.current]);
            const lines = [
              { label: 'STREAK', value: 'x' + lineStreakMult.toFixed(1), color: '#ff9020' },
              { label: 'COMPOUND', value: 'x1.5', color: '#40d0ff' },
              { label: 'ROUND TOTAL', value: '+' + roundScoreAccum.current, color: '#fff' },
            ];
            setScoreBreakdown(lines);
            lines.forEach((_, i) => setTimeout(() => AudioEngine.playScoreTick(i), i * 120));
            setFeedback('');
            endRound();
          } else {
            // required line done — mark completed, instant reset for next tap
            completedLinesRef.current = [...completedLinesRef.current, curIdx];
            setCompletedLines([...completedLinesRef.current]);
            const remaining = totalLines - completedLinesRef.current.length;
            const nextIsBonus = remaining === 1 && totalLines > 1;
            setLineLabel(nextIsBonus ? t('bonusLine', lang) : (completedLinesRef.current.length + 1) + '/' + totalLines);
            AudioEngine.playScoreTick(0);
            setFeedback('');
            advanceToNextLine();
          }
        } else {
          AudioEngine.stopLaser();
          if (isBonusLine) {
            // bonus failed — no penalty, end round with tally
            setFeedback('');
            if (roundScoreAccum.current > 0) {
              setScoreBreakdown([{ label: 'ROUND TOTAL', value: '+' + roundScoreAccum.current, color: '#fff' }]);
              AudioEngine.playScoreTick(0);
            }
            endRound();
          } else {
            AudioEngine.playFail();
            clearInterval(timerRef.current);
            setFeedback(result.reason || (result.coverage <= 0.5 ? "TRACE FURTHER" : "TOO SLOPPY"));
            if (!hasFailedOnce.current) {
              hasFailedOnce.current = true;
              setShowTutorial(true);
            } else {
              setGameState("gameover");
              gameStateRef.current = "gameover";
            }
          }
        }
      }, [evaluateDrag, maxTime, multiplier, lv.set, cx, cy, circleR, advanceToNextLine, lang]);

      // FULLY NATIVE event handling — no React synthetic events at all
      // This eliminates any race between React's event system and native touch
      useEffect(() => {
        const el = containerRef.current;
        if (!el) return;
        const opts = { passive: false };

        const onDown = (e) => {
          if (gameStateRef.current !== "playing" || attemptDoneRef.current) return;
          const isTouch = e.type === 'touchstart';
          if (showLineRef.current) return;
          const rect = el.getBoundingClientRect();
          const px = (isTouch ? e.touches[0].clientX : e.clientX) - rect.left;
          const py = (isTouch ? e.touches[0].clientY : e.clientY) - rect.top;

          // check only VISIBLE uncompleted dots
          const targets = lineTargetsRef.current;
          const completed = completedLinesRef.current;
          const visible = visibleDotsRef.current;
          let hitIdx = -1;
          for (let i = 0; i < visible && i < targets.length; i++) {
            if (completed.includes(i)) continue;
            const tdx = cx + Math.cos(targets[i].dotAngle) * circleR;
            const tdy = cy + Math.sin(targets[i].dotAngle) * circleR;
            if (dist(px, py, tdx, tdy) < 35) { hitIdx = i; break; }
          }
          if (hitIdx === -1) return;

          // only prevent default after confirmed dot hit
          if (isTouch) e.preventDefault();

          const lt = targets[hitIdx];
          currentLineIdxRef.current = hitIdx;
          roundSetupRef.current = { dotAngle: lt.dotAngle, lineAngle: lt.lineAngle, lineLength: lt.lineLength };
          setDotAngle(lt.dotAngle);
          setLineTarget({ angle: lt.lineAngle, length: lt.lineLength });

          // reveal next dot on tap
          if (visible < targets.length) {
            visibleDotsRef.current = visible + 1;
            setVisibleDots(visible + 1);
          }

          showLineRef.current = true;
          isDraggingRef.current = true;
          dragPathRef.current = [{ x: px, y: py }];
          setShowLine(true);
          setIsDragging(true);
          setDragPath([{ x: px, y: py }]);
          // timer starts on first tap of the round
          if (completed.length === 0) {
            levelStartTime.current = Date.now();
            timerStartedRef.current = true;
            setTimerStarted(true);
          }
          AudioEngine.startLaser();
          const drawSpeed = 0.12 + lv.set * 0.02 + lv.tier * 0.05;
          const fadeSpeed = 0.015 + lv.set * 0.004 + lv.tier * 0.01;
          let prog = 0;
          const anim = () => {
            prog += drawSpeed;
            if (prog >= 1) {
              setLineProgress(1);
              let fade = 1;
              const fadeAnim = () => {
                fade -= fadeSpeed;
                if (fade <= 0) { setLineFade(0); return; }
                setLineFade(fade);
                fadeAnimRef.current = requestAnimationFrame(fadeAnim);
              };
              fadeAnimRef.current = requestAnimationFrame(fadeAnim);
              return;
            }
            setLineProgress(prog);
            lineAnimRef.current = requestAnimationFrame(anim);
          };
          anim();
        };

        const onMove = (e) => {
          if (!isDraggingRef.current || attemptDoneRef.current) return;
          const isTouch = e.type === 'touchmove';
          if (isTouch) e.preventDefault();
          const rect = el.getBoundingClientRect();
          const px = (isTouch ? e.touches[0].clientX : e.clientX) - rect.left;
          const py = (isTouch ? e.touches[0].clientY : e.clientY) - rect.top;
          const pt = { x: px, y: py };
          dragPathRef.current.push(pt);
          setDragPath((prev) => [...prev, pt]);
        };

        const onUp = (e) => {
          if (!isDraggingRef.current || attemptDoneRef.current) return;
          const isTouch = e.type === 'touchend' || e.type === 'touchcancel';
          if (isTouch) e.preventDefault();
          finishAttempt(dragPathRef.current);
        };

        const noContext = (e) => e.preventDefault();

        // Touch events (mobile)
        el.addEventListener('touchstart', onDown, opts);
        el.addEventListener('touchmove', onMove, opts);
        el.addEventListener('touchend', onUp, opts);
        el.addEventListener('touchcancel', onUp, opts);
        // Mouse events (desktop)
        el.addEventListener('mousedown', onDown);
        el.addEventListener('mousemove', onMove);
        el.addEventListener('mouseup', onUp);
        // Block context menu
        el.addEventListener('contextmenu', noContext);

        return () => {
          el.removeEventListener('touchstart', onDown, opts);
          el.removeEventListener('touchmove', onMove, opts);
          el.removeEventListener('touchend', onUp, opts);
          el.removeEventListener('touchcancel', onUp, opts);
          el.removeEventListener('mousedown', onDown);
          el.removeEventListener('mousemove', onMove);
          el.removeEventListener('mouseup', onUp);
          el.removeEventListener('contextmenu', noContext);
        };
      }, [cx, cy, circleR, totalRound, finishAttempt, lv]);

      useEffect(() => {
        if (gameState === "success") {
          if (totalRound > 0 && totalRound % 10 === 0) {
            const newLv = calcLevel(totalRound);
            const newMult = getMultiplier(newLv);
            setCheckpoint({ round: totalRound, score: internalScore.current, holeRadius: holeRadius });

            const overallAcc = totalAccAttempts.current > 0
              ? (totalAccHits.current / totalAccAttempts.current) * 100 : 0;
            let bonusRetry = false;
            if ((totalRound === 20 || totalRound === 30) && overallAcc >= 95) {
              setRetriesLeft((prev) => prev + 1);
              bonusRetry = true;
            }

            setMilestone({ mult: newMult, level: levelString(newLv), bonusRetry });
            const t = setTimeout(() => {
              setMilestone(null);
              if (startLevelRef.current) startLevelRef.current();
            }, 1500);
            return () => clearTimeout(t);
          } else {
            const t = setTimeout(() => {
              if (startLevelRef.current) startLevelRef.current();
            }, 1100);
            return () => clearTimeout(t);
          }
        }
      }, [gameState, totalRound, holeRadius]);

      // Check if score qualifies for leaderboard when entering gameover
      useEffect(() => {
        if (gameState === "gameover" && score > 0) {
          loadScoreboard(gameMode).then(result => {
            const scores = result.scores;
            setQualifiesForBoard(scores.length < 10 || score > scores[scores.length - 1].s);
          });
        } else if (gameState === "gameover") {
          setQualifiesForBoard(false);
        }
      }, [gameState, score]);

      const handleSubmitScore = async () => {
        if (submittingRef.current) return;
        submittingRef.current = true;
        setIsSubmitting(true);
        const name = playerName.trim().toUpperCase() || "ANON";

        // profanity check when online — PurgoMalum free API, no library needed
        if (_online && name !== 'ANON') {
          try {
            const res = await fetch(
              'https://www.purgomalum.com/service/containsprofanity?text=' + encodeURIComponent(name),
              { signal: AbortSignal.timeout(2000) }
            );
            if (res.ok && (await res.text()).trim() === 'true') {
              setNameShake(true);
              setSubmitStatus("Name not allowed");
              setPlayerName("");
              submittingRef.current = false;
              setIsSubmitting(false);
              setTimeout(() => setNameShake(false), 500);
              return;
            }
          } catch {} // API down — let server-side check catch it
        }

        setSubmitStatus("Submitting...");
        const result = await submitGameData(name, roundLog.current, score, gameMode);
        if (result.error) {
          if (result.error === 'profanity') {
            // server caught it
            setNameShake(true);
            setSubmitStatus("Name not allowed");
            setPlayerName("");
            submittingRef.current = false;
            setIsSubmitting(false);
            setTimeout(() => setNameShake(false), 500);
          } else {
            setSubmitStatus("Failed: " + result.error);
            submittingRef.current = false;
            setIsSubmitting(false);
          }
        } else {
          const where = result.source === 'local' ? ' (local)' : '';
          if (result.rank) {
            setSubmitStatus("Rank #" + result.rank + "!" + where);
          } else if (result.message) {
            setSubmitStatus(result.message + where);
          } else {
            setSubmitStatus("Saved!" + where);
          }
          setTimeout(() => setGameState("scores"), 1200);
        }
      };

      const handleRetry = () => {
        if (retriesLeft > 0 && checkpoint) {
          retryFromCheckpoint();
        } else if (qualifiesForBoard) {
          setGameState("submit");
        } else {
          setGameState("menu");
        }
      };

      const timerWidth = timerStarted ? (timeLeft / maxTime) * 100 : 100;
      const timerColor = timeLeft < 0.8 ? "#ff2040" : timeLeft < 1.5 ? "#ffaa00" : "#a855f7";

      return (
        <div
          ref={containerRef}
          style={{
            position: "fixed", inset: 0, background: "#08060e",
            overflow: "hidden", cursor: isDragging ? "grabbing" : "default",
            userSelect: "none", WebkitUserSelect: "none",
            touchAction: gameState === "playing" ? "none" : "auto",
            WebkitTouchCallout: "none", WebkitTapHighlightColor: "transparent",
          }}
        >
          <BackgroundBlobs />

          <style>{`
            @keyframes pulseRed{0%,100%{box-shadow:0 0 8px 2px rgba(255,40,60,0.6);transform:translate(-50%,-50%) scale(1)}50%{box-shadow:0 0 20px 8px rgba(255,40,60,0.9);transform:translate(-50%,-50%) scale(1.3)}}
            @keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
            @keyframes scoreFloat{
              0%{opacity:1;transform:translate(-50%,0) scale(1)}
              30%{opacity:1;transform:translate(-50%,-30px) scale(1.3)}
              60%{opacity:0.8;transform:translate(-50%,-120px) scale(0.9)}
              100%{opacity:0;transform:translate(-50%,-200px) scale(0.5)}
            }
            @keyframes scoreLine{
              0%{opacity:0;transform:translateX(30px)}
              20%{opacity:1;transform:translateX(0)}
              70%{opacity:1;transform:translateX(0)}
              100%{opacity:0;transform:translateX(-10px)}
            }
            @keyframes shake1{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
            @keyframes shake2{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
            @keyframes milestoneIn{0%{opacity:0;transform:translate(-50%,-50%) scale(0.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
            @keyframes nameShake{0%,100%{transform:translateX(0)}10%{transform:translateX(-8px)}20%{transform:translateX(8px)}30%{transform:translateX(-6px)}40%{transform:translateX(6px)}50%{transform:translateX(-4px)}60%{transform:translateX(4px)}70%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
            @keyframes titlePulse{0%,100%{text-shadow:0 0 20px rgba(255,255,255,0.3), 0 0 40px rgba(168,85,247,0.3)}50%{text-shadow:0 0 40px rgba(255,255,255,0.7), 0 0 80px rgba(168,85,247,0.5), 0 0 120px rgba(255,255,255,0.2)}}
            @keyframes tutorialDot{0%{left:15%;top:50%;opacity:1}100%{left:85%;top:30%;opacity:0.6}}
            @keyframes tutorialTrace{0%{width:0}100%{width:70%}}
          `}</style>

          {/* BLACK HOLE (z:1) */}
          <div style={{
            position: "absolute",
            left: cx - holeCanvasSize / 2, top: cy - holeCanvasSize / 2,
            width: holeCanvasSize, height: holeCanvasSize,
            zIndex: 1, pointerEvents: "none",
          }}>
            <BlackHole size={holeCanvasSize} radius={cappedHoleRadius} />
          </div>

          {/* GAME INTERFACE (z:10) */}
          <svg style={{ position: "absolute", inset: 0, zIndex: 10, pointerEvents: "none" }}
            width={dims.w} height={dims.h}>
            <circle cx={cx} cy={cy} r={circleR} fill="none" stroke="rgba(168,85,247,0.35)" strokeWidth={2} />
            <circle cx={cx} cy={cy} r={circleR} fill="none" stroke="rgba(168,85,247,0.1)" strokeWidth={circleR * 0.4} strokeDasharray="2 8" />
            {showLine && lineTarget && lineFade > 0 && (
              <line x1={dotX} y1={dotY}
                x2={lerp(dotX, lineEndX, lineProgress)} y2={lerp(dotY, lineEndY, lineProgress)}
                stroke={'rgba(168,85,247,' + (0.8 * lineFade) + ')'} strokeWidth={3} strokeLinecap="round"
                style={{ filter: lineFade > 0.3 ? "drop-shadow(0 0 6px rgba(168,85,247,0.5))" : "none" }} />
            )}
            {showLine && lineTarget && lineProgress >= 1 && lineFade > 0 && (
              <circle cx={lineEndX} cy={lineEndY} r={5} fill={'rgba(168,85,247,' + (0.6 * lineFade) + ')'}
                style={{ filter: lineFade > 0.3 ? "drop-shadow(0 0 8px rgba(168,85,247,0.8))" : "none" }} />
            )}
            {dragPath.length > 1 && (
              <polyline points={dragPath.map((p) => p.x + "," + p.y).join(" ")}
                fill="none" stroke="rgba(255,255,255,0.7)" strokeWidth={2.5}
                strokeLinecap="round" strokeLinejoin="round"
                style={{ filter: "drop-shadow(0 0 4px rgba(255,255,255,0.3))" }} />
            )}
          </svg>

          {/* PORTAL EFFECT on success */}
          <Portal cx={cx} cy={cy} radius={circleR + 10} active={showPortal} bonusCount={portalBonusCount} />

          {/* Dots — staggered: only visible ones shown, all red (z:15) */}
          {gameState === "playing" && !showLine && !attemptDone && allLines.map((lt, i) => {
            if (i >= visibleDots || completedLines.includes(i)) return null;
            return (
              <div key={'dot-'+i} style={{
                position: "absolute",
                left: cx + Math.cos(lt.dotAngle) * circleR,
                top: cy + Math.sin(lt.dotAngle) * circleR,
                width: 16 + dotPulse * 14, height: 16 + dotPulse * 14,
                borderRadius: "50%", background: "radial-gradient(circle, #ff3050, #cc1030)",
                transform: "translate(-50%,-50%)", zIndex: 15,
                boxShadow: '0 0 ' + (8 + dotPulse * 16) + 'px ' + (2 + dotPulse * 6) + 'px rgba(255,40,60,' + (0.5 + dotPulse * 0.4) + ')',
                cursor: "pointer", pointerEvents: "none",
              }} />
            );
          })}

          {/* HUD (z:20) */}
          <div style={{
            position: "absolute", top: 0, left: 0, right: 0,
            padding: "max(12px, 2vh) 5vw 0", zIndex: 20,
            animation: shakeLevel === 2 ? "shake2 0.15s infinite" : shakeLevel === 1 ? "shake1 0.2s infinite" : "none",
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div style={{ color: "#a855f7", fontSize: "clamp(11px,2.5vw,16px)", letterSpacing: 2, opacity: 0.8, display: "flex", alignItems: "center", gap: 6 }}>
                {isOnline !== null && (
                  <span style={{
                    display: "inline-block", width: 6, height: 6, borderRadius: "50%",
                    background: isOnline ? "#40dd60" : "#ff3050",
                    boxShadow: isOnline ? "0 0 6px rgba(64,221,96,0.5)" : "0 0 6px rgba(255,48,80,0.5)",
                  }} />
                )}
                <span style={{ color: "#fff", fontWeight: 700 }}>{levelString(lv)}</span>
                {multiplier > 1 && (
                  <span style={{ color: "#ff3050", marginLeft: 4, fontSize: "clamp(9px,2vw,12px)" }}>{multiplier}x</span>
                )}
                {lineLabel && (
                  <span style={{ color: lineLabel === t('bonusLine', lang) ? "#40d0ff" : "rgba(168,85,247,0.6)", marginLeft: 6, fontSize: "clamp(8px,1.8vw,10px)", letterSpacing: 1 }}>{lineLabel}</span>
                )}
              </div>
              <div style={{ color: "#fff", fontSize: "clamp(14px,3.5vw,22px)", fontWeight: 700, letterSpacing: 3 }}>{score.toLocaleString()}</div>
            </div>
            <div style={{
              marginTop: 8, height: 3, width: "100%",
              background: "rgba(255,255,255,0.06)", borderRadius: 2, overflow: "hidden",
            }}>
              {gameState === "playing" && (
                <div style={{
                  height: "100%", width: timerWidth + "%", background: timerColor,
                  borderRadius: 2, transition: "width 0.05s linear, background 0.3s",
                  boxShadow: "0 0 10px " + timerColor,
                }} />
              )}
            </div>
          </div>

          {/* Score breakdown stack — success */}
          {scoreBreakdown.length > 0 && gameState === "success" && (
            <div key={'bd-' + totalRound} style={{
              position: "absolute", left: "50%", top: cy - circleR - 30,
              transform: "translateX(-50%)",
              zIndex: 30, pointerEvents: "none",
              display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 2,
            }}>
              {scoreBreakdown.map((line, i) => (
                <div key={i} style={{
                  display: "flex", gap: 10, alignItems: "baseline",
                  animation: 'scoreLine 1.2s ease-out forwards',
                  animationDelay: (i * 0.15) + 's',
                  opacity: 0,
                  fontSize: i === scoreBreakdown.length - 1 ? "clamp(18px,4.5vw,28px)" : "clamp(11px,2.5vw,16px)",
                  fontWeight: i === scoreBreakdown.length - 1 ? 700 : 400,
                }}>
                  <span style={{ color: "rgba(255,255,255,0.4)", letterSpacing: 2, fontSize: "clamp(8px,1.8vw,11px)" }}>{line.label}</span>
                  <span style={{
                    color: line.color, fontWeight: 700, letterSpacing: 2,
                    textShadow: '0 0 12px ' + line.color + '66',
                  }}>{line.value}</span>
                </div>
              ))}
            </div>
          )}

          {/* Fail feedback */}
          {feedback && gameState === "gameover" && (
            <div key={feedback + totalRound} style={{
              position: "absolute", left: "50%", top: cy - circleR - 50,
              transform: "translateX(-50%)",
              color: "#ff3050",
              fontSize: "clamp(18px,5vw,32px)", fontWeight: 700, letterSpacing: 3, zIndex: 30,
              animation: "scoreFloat 1.2s ease-out forwards", pointerEvents: "none",
              textShadow: "0 0 20px rgba(255,48,80,0.8)",
            }}>{feedback}</div>
          )}

          {/* TUTORIAL — shows on first fail, tap to dismiss */}
          {showTutorial && (
            <div
              onClick={() => { setShowTutorial(false); startLevel(); }}
              onTouchEnd={(e) => { e.preventDefault(); setShowTutorial(false); startLevel(); }}
              style={{
                position: "absolute", inset: 0, zIndex: 55,
                background: "rgba(8,6,14,0.9)",
                display: "flex", flexDirection: "column",
                alignItems: "center", justifyContent: "center",
                cursor: "pointer", padding: "5vw",
              }}
            >
              <div style={{
                fontSize: "clamp(14px,3.5vw,20px)", color: "#a855f7",
                letterSpacing: 3, marginBottom: "3vh", textTransform: "uppercase",
                fontWeight: 700,
              }}>{t('howToPlay', lang)}</div>
              <div style={{
                fontSize: "clamp(13px,3vw,18px)", color: "rgba(255,255,255,0.8)",
                textAlign: "center", lineHeight: 2, maxWidth: 360,
                letterSpacing: 1, whiteSpace: "pre-line",
              }}>{t('tutorialFail', lang)}</div>
              <div style={{
                marginTop: "5vh", fontSize: "clamp(10px,2vw,12px)",
                color: "rgba(168,85,247,0.4)", letterSpacing: 3, textTransform: "uppercase",
              }}>{t('tapContinue', lang)}</div>
            </div>
          )}

          {/* MILESTONE BANNER */}
          {milestone && (
            <div key={'ms-' + milestone.mult} style={{
              position: "absolute", left: "50%", top: "50%",
              transform: "translate(-50%,-50%)",
              zIndex: 55, pointerEvents: "none",
              display: "flex", flexDirection: "column", alignItems: "center",
              animation: "milestoneIn 2s ease-out forwards",
            }}>
              <div style={{
                fontSize: "clamp(40px,12vw,80px)", fontWeight: 700,
                color: "#ff3050", letterSpacing: 6,
                textShadow: "0 0 40px rgba(255,48,80,0.6), 0 0 80px rgba(255,48,80,0.3)",
              }}>x{milestone.mult}</div>
              <div style={{
                fontSize: "clamp(16px,4vw,28px)", fontWeight: 700,
                color: "#fff", letterSpacing: 8, marginTop: 4,
                textShadow: "0 0 20px rgba(255,255,255,0.4)",
              }}>{ t('bonus', lang) }</div>
              <div style={{
                fontSize: "clamp(10px,2.5vw,14px)",
                color: "rgba(168,85,247,0.7)", letterSpacing: 3, marginTop: 12,
              }}>{ t('multiplierActive', lang) }</div>
              {milestone.bonusRetry && (
                <div style={{
                  fontSize: "clamp(12px,3vw,16px)", fontWeight: 700,
                  color: "#40d0ff", letterSpacing: 4, marginTop: 10,
                  textShadow: "0 0 15px rgba(64,208,255,0.5)",
                }}>{ t('bonusRetry', lang) }</div>
              )}
            </div>
          )}

          {/* SCOREBOARD */}
          {gameState === "scores" && (
            <Scoreboard onClose={() => setGameState("menu")} lang={lang} mode={gameMode} />
          )}

          {/* OVERLAYS */}
          {(gameState === "menu" || gameState === "gameover" || gameState === "submit" || gameState === "tutorial" || gameState === "rules") && (
            <div style={{
              position: "absolute", inset: 0, display: "flex", flexDirection: "column",
              alignItems: "center",
              justifyContent: (gameState === "rules" || gameState === "tutorial") ? "flex-start" : "center",
              zIndex: 50,
              background: gameState === "menu" ? "rgba(8,6,14,0.85)" : "rgba(8,6,14,0.88)",
              animation: "fadeInUp 0.5s ease-out", overflow: "auto",
              paddingTop: (gameState === "rules" || gameState === "tutorial") ? "max(20px, 4vh)" : 0,
              paddingBottom: (gameState === "rules" || gameState === "tutorial") ? "max(20px, 4vh)" : 0,
            }}>
              {gameState === "menu" && (<>
                <div style={{
                  position: "absolute", left: "50%", top: "45%",
                  width: "min(400px, 70vw)", height: "min(400px, 70vw)",
                  borderRadius: "50%",
                  background: "radial-gradient(circle, rgba(180,40,60,0.25) 0%, rgba(120,20,50,0.15) 40%, transparent 70%)",
                  filter: "blur(40px)",
                  transform: "translate(-50%,-50%)",
                  pointerEvents: "none",
                }} />
                <div style={{ fontSize: "clamp(36px,10vw,72px)", fontWeight: 700, color: "#fff", letterSpacing: 8, marginBottom: 8, animation: "titlePulse 3s ease-in-out infinite" }}>{t('title', lang)}</div>
                <div style={{ fontSize: "clamp(10px,2.5vw,14px)", color: "rgba(200,170,255,0.8)", letterSpacing: 6, marginBottom: "2vh", textTransform: "uppercase" }}>{t('subtitle', lang)}</div>

                {/* Mode selector */}
                <div style={{ display: "flex", gap: 0, marginBottom: "3vh" }}>
                  {['classic', 'arcade'].map(m => (
                    <button key={m} onClick={() => setGameMode(m)} style={{
                      background: gameMode === m ? "rgba(168,85,247,0.15)" : "none",
                      border: "1px solid " + (gameMode === m ? "rgba(168,85,247,0.6)" : "rgba(168,85,247,0.15)"),
                      color: gameMode === m ? "#c084fc" : "rgba(168,85,247,0.35)",
                      padding: "8px 20px", fontSize: "clamp(9px,2vw,12px)",
                      letterSpacing: 3, cursor: "pointer", borderRadius: 0,
                      textTransform: "uppercase", fontFamily: "'Space Mono',monospace",
                      transition: "all 0.2s",
                      borderLeft: m === 'arcade' ? 'none' : undefined,
                    }}>{t(m, lang)}</button>
                  ))}
                </div>

                {/* Stacking button system */}
                <div style={{ display: "flex", flexDirection: "column", gap: 0, alignItems: "center", width: "min(300px, 75vw)" }}>
                  {[
                    { key: 'begin', action: () => startGame(gameMode), primary: true },
                    { key: 'tutorial', action: () => setGameState("tutorial") },
                    { key: 'rules', action: () => setGameState("rules") },
                    { key: 'scores', action: () => setGameState("scores") },
                  ].map((btn, i) => {
                    const isHovered = hoveredBtn === btn.key;
                    const hasHover = hoveredBtn !== null;
                    const shrink = hasHover && !isHovered;
                    return (
                      <button key={btn.key}
                        onClick={btn.action}
                        onMouseEnter={() => setHoveredBtn(btn.key)}
                        onMouseLeave={() => setHoveredBtn(null)}
                        onTouchStart={() => setHoveredBtn(btn.key)}
                        onTouchEnd={() => setTimeout(() => setHoveredBtn(null), 150)}
                        style={{
                          background: isHovered ? "rgba(168,85,247,0.12)" : "none",
                          border: "1px solid " + (isHovered ? "rgba(168,85,247,0.8)" : btn.primary ? "rgba(168,85,247,0.4)" : "rgba(168,85,247,0.2)"),
                          color: isHovered ? "#c084fc" : btn.primary ? "#a855f7" : "rgba(168,85,247,0.6)",
                          padding: isHovered ? "14px 40px" : shrink ? "8px 40px" : "11px 40px",
                          fontSize: isHovered ? "clamp(14px,3.5vw,18px)" : shrink ? "clamp(9px,2vw,12px)" : btn.primary ? "clamp(12px,3vw,16px)" : "clamp(11px,2.5vw,14px)",
                          letterSpacing: isHovered ? 6 : btn.primary ? 4 : 3,
                          cursor: "pointer", borderRadius: 0,
                          textTransform: "uppercase",
                          fontFamily: "'Space Mono',monospace",
                          width: "100%",
                          transition: "all 0.25s ease-out",
                          transform: isHovered ? "scale(1.03)" : shrink ? "scale(0.96)" : "scale(1)",
                          opacity: shrink ? 0.5 : 1,
                          borderTop: i > 0 ? "none" : undefined,
                          marginTop: i > 0 ? -1 : 0,
                          position: "relative",
                          zIndex: isHovered ? 2 : 1,
                        }}
                      >{t(btn.key, lang)}</button>
                    );
                  })}
                </div>

                <div style={{ marginTop: "3vh", color: "rgba(255,255,255,0.7)", fontSize: "clamp(9px,2vw,11px)", textAlign: "center", lineHeight: 1.8, letterSpacing: 1, maxWidth: "80%" }}>{t('hint', lang)}</div>

                {/* Language selector — center bottom, 2 rows of 6 */}
                <div style={{
                  position: "absolute", bottom: "max(12px, 2vh)", left: "50%",
                  transform: "translateX(-50%)",
                  display: "grid", gridTemplateColumns: "repeat(6, auto)", gap: 4,
                  justifyContent: "center",
                }}>
                  {LANGS.map(l => (
                    <button key={l} onClick={() => setLang(l)} style={{
                      background: l === lang ? "rgba(168,85,247,0.2)" : "none",
                      border: "1px solid " + (l === lang ? "rgba(168,85,247,0.5)" : "rgba(255,255,255,0.08)"),
                      color: l === lang ? "#a855f7" : "rgba(255,255,255,0.25)",
                      padding: "3px 6px", fontSize: "clamp(7px,1.4vw,9px)",
                      letterSpacing: 1, cursor: "pointer", borderRadius: 0,
                      fontFamily: "'Space Mono',monospace",
                      transition: "all 0.2s",
                    }}>{l}</button>
                  ))}
                </div>
              </>)}

              {/* TUTORIAL MODE */}
              {gameState === "tutorial" && (
                <div style={{ maxWidth: 420, width: "90%", padding: "2vh 0" }}>
                  <div style={{ fontSize: "clamp(20px,5vw,32px)", fontWeight: 700, color: "#a855f7", letterSpacing: 4, marginBottom: "3vh", textAlign: "center" }}>{t('tutorial', lang)}</div>

                  {/* Animated demo */}
                  <div style={{
                    position: "relative", width: "100%", height: 120, marginBottom: "3vh",
                    background: "rgba(168,85,247,0.05)", border: "1px solid rgba(168,85,247,0.15)",
                    overflow: "hidden",
                  }}>
                    {/* Circle */}
                    <div style={{
                      position: "absolute", left: "15%", top: "50%", transform: "translate(-50%,-50%)",
                      width: 50, height: 50, borderRadius: "50%",
                      border: "2px solid rgba(168,85,247,0.35)",
                    }} />
                    {/* Red dot */}
                    <div style={{
                      position: "absolute", left: "15%", top: "32%",
                      width: 12, height: 12, borderRadius: "50%",
                      background: "#ff3050", boxShadow: "0 0 8px rgba(255,48,80,0.6)",
                      transform: "translate(-50%,-50%)",
                    }} />
                    {/* Target line */}
                    <div style={{
                      position: "absolute", left: "15%", top: "32%",
                      width: "65%", height: 3, background: "rgba(168,85,247,0.4)",
                      transformOrigin: "left center", transform: "rotate(-12deg)",
                    }} />
                    {/* Animated trace line */}
                    <div style={{
                      position: "absolute", left: "15%", top: "32%",
                      height: 3, background: "rgba(255,255,255,0.8)",
                      transformOrigin: "left center", transform: "rotate(-12deg)",
                      animation: "tutorialTrace 2s ease-in-out infinite",
                      boxShadow: "0 0 6px rgba(255,255,255,0.4)",
                    }} />
                    {/* Finger icon */}
                    <div style={{
                      position: "absolute",
                      animation: "tutorialDot 2s ease-in-out infinite",
                      fontSize: 20, transform: "translate(-50%,-50%)",
                    }}>👆</div>
                    {/* Labels */}
                    <div style={{ position: "absolute", right: 8, bottom: 8, fontSize: "clamp(7px,1.5vw,9px)", color: "rgba(168,85,247,0.5)", letterSpacing: 1 }}>
                      <span style={{ color: "rgba(168,85,247,0.6)" }}>━</span> target &nbsp;
                      <span style={{ color: "rgba(255,255,255,0.7)" }}>━</span> trace
                    </div>
                  </div>

                  {/* Steps */}
                  <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                    {(T.tutorialSteps[lang] || T.tutorialSteps.ENG).map((step, i) => (
                      <div key={i} style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                        <div style={{
                          minWidth: 24, height: 24, borderRadius: "50%",
                          background: "rgba(168,85,247,0.15)", border: "1px solid rgba(168,85,247,0.3)",
                          display: "flex", alignItems: "center", justifyContent: "center",
                          fontSize: "clamp(9px,2vw,11px)", color: "#a855f7", fontWeight: 700,
                        }}>{i + 1}</div>
                        <div style={{
                          fontSize: "clamp(11px,2.5vw,13px)", color: "rgba(255,255,255,0.75)",
                          lineHeight: 1.6, letterSpacing: 0.5,
                        }}>{step}</div>
                      </div>
                    ))}
                  </div>

                  <div style={{ textAlign: "center", marginTop: "3vh" }}>
                    <button onClick={() => setGameState("menu")} style={{
                      background: "none", border: "1px solid rgba(168,85,247,0.4)",
                      color: "#a855f7", padding: "10px 30px", fontSize: "clamp(11px,2.5vw,14px)",
                      letterSpacing: 3, cursor: "pointer", borderRadius: 0,
                      textTransform: "uppercase", fontFamily: "'Space Mono',monospace",
                    }}>{t('back', lang)}</button>
                  </div>
                </div>
              )}

              {/* RULES MODE */}
              {gameState === "rules" && (
                <div style={{ maxWidth: 420, width: "90%", padding: "2vh 0" }}>
                  <div style={{ fontSize: "clamp(20px,5vw,32px)", fontWeight: 700, color: "#a855f7", letterSpacing: 4, marginBottom: "2vh", textAlign: "center" }}>{t('rules', lang)}</div>

                  {/* Classic / Arcade toggle */}
                  <div style={{ display: "flex", justifyContent: "center", gap: 0, marginBottom: "2.5vh" }}>
                    {["classic", "arcade"].map(tab => (
                      <button key={tab} onClick={() => setRulesTab(tab)} style={{
                        background: rulesTab === tab ? "rgba(168,85,247,0.2)" : "none",
                        border: "1px solid " + (rulesTab === tab ? "rgba(168,85,247,0.5)" : "rgba(255,255,255,0.1)"),
                        color: rulesTab === tab ? "#a855f7" : "rgba(255,255,255,0.35)",
                        padding: "8px 24px", fontSize: "clamp(10px,2.2vw,13px)",
                        letterSpacing: 3, cursor: "pointer", borderRadius: 0,
                        textTransform: "uppercase", fontFamily: "'Space Mono',monospace",
                        transition: "all 0.2s", fontWeight: rulesTab === tab ? 700 : 400,
                      }}>{tab === "classic" ? t('classic', lang) : t('arcade', lang)}</button>
                    ))}
                  </div>

                  {/* Shared rules */}
                  <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                    {(T.rulesText[lang] || T.rulesText.ENG).map((rule, i) => (
                      <div key={'s'+i} style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                        <div style={{
                          minWidth: 6, height: 6, borderRadius: "50%", marginTop: 7,
                          background: i < 2 ? "#a855f7" : i < 5 ? "#ff9020" : "#40d0ff",
                        }} />
                        <div style={{
                          fontSize: "clamp(11px,2.5vw,13px)", color: "rgba(255,255,255,0.75)",
                          lineHeight: 1.6, letterSpacing: 0.5,
                        }}>{rule}</div>
                      </div>
                    ))}
                  </div>

                  {/* Mode-specific rules */}
                  <div style={{ marginTop: "2vh", paddingTop: "1.5vh", borderTop: "1px solid rgba(168,85,247,0.15)" }}>
                    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                      {(rulesTab === "classic"
                        ? (T.classicRules[lang] || T.classicRules.ENG)
                        : (T.arcadeRules[lang] || T.arcadeRules.ENG)
                      ).map((rule, i) => (
                        <div key={'m'+i} style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                          <div style={{
                            minWidth: 6, height: 6, borderRadius: "50%", marginTop: 7,
                            background: rulesTab === "classic" ? "#a855f7" : "#ff3050",
                          }} />
                          <div style={{
                            fontSize: "clamp(11px,2.5vw,13px)", color: "rgba(255,255,255,0.75)",
                            lineHeight: 1.6, letterSpacing: 0.5,
                          }}>{rule}</div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div style={{ textAlign: "center", marginTop: "3vh" }}>
                    <button onClick={() => setGameState("menu")} style={{
                      background: "none", border: "1px solid rgba(168,85,247,0.4)",
                      color: "#a855f7", padding: "10px 30px", fontSize: "clamp(11px,2.5vw,14px)",
                      letterSpacing: 3, cursor: "pointer", borderRadius: 0,
                      textTransform: "uppercase", fontFamily: "'Space Mono',monospace",
                    }}>{t('back', lang)}</button>
                  </div>
                </div>
              )}

              {/* GAMEOVER */}
              {gameState === "gameover" && (<>
                <div style={{ fontSize: "clamp(20px,6vw,40px)", fontWeight: 700, color: "#ff3050", letterSpacing: 4, marginBottom: 16 }}>{feedback || t('consumed', lang)}</div>
                <div style={{ fontSize: "clamp(28px,8vw,56px)", fontWeight: 700, color: "#fff", marginBottom: 8 }}>{score.toLocaleString()}</div>
                <div style={{ fontSize: "clamp(10px,2.5vw,13px)", color: "rgba(255,255,255,0.3)", letterSpacing: 3, marginBottom: "3vh" }}>
                  {levelString(lv)}
                </div>
                {retriesLeft > 0 && checkpoint ? (
                  <>
                    <button onClick={handleRetry} style={{ background: "none", border: "1px solid rgba(168,85,247,0.4)", color: "#a855f7", padding: "12px 40px", fontSize: "clamp(12px,3vw,16px)", letterSpacing: 4, cursor: "pointer", borderRadius: 0, textTransform: "uppercase", fontFamily: "'Space Mono',monospace" }}>
                      {t('retry', lang)} {retriesLeft}
                    </button>
                    <div style={{ marginTop: 12, fontSize: "clamp(8px,1.8vw,10px)", color: "rgba(168,85,247,0.4)", letterSpacing: 2 }}>
                      checkpoint: {levelString(calcLevel(checkpoint.round))}
                    </div>
                  </>
                ) : qualifiesForBoard ? (
                  <div style={{ display: "flex", gap: 12, flexWrap: "wrap", justifyContent: "center" }}>
                    <button onClick={handleRetry} style={{ background: "none", border: "1px solid rgba(168,85,247,0.4)", color: "#a855f7", padding: "12px 40px", fontSize: "clamp(12px,3vw,16px)", letterSpacing: 4, cursor: "pointer", borderRadius: 0, textTransform: "uppercase", fontFamily: "'Space Mono',monospace" }}>
                      {t('submitScore', lang)}
                    </button>
                    <button onClick={() => setGameState("menu")} style={{
                      background: "none", border: "1px solid rgba(255,255,255,0.15)",
                      color: "rgba(255,255,255,0.4)", padding: "12px 30px", fontSize: "clamp(11px,2.5vw,14px)",
                      letterSpacing: 3, cursor: "pointer", borderRadius: 0,
                      textTransform: "uppercase", fontFamily: "'Space Mono',monospace",
                    }}>{t('cancel', lang)}</button>
                  </div>
                ) : (
                  <button onClick={() => setGameState("menu")} style={{ background: "none", border: "1px solid rgba(168,85,247,0.4)", color: "#a855f7", padding: "12px 40px", fontSize: "clamp(12px,3vw,16px)", letterSpacing: 4, cursor: "pointer", borderRadius: 0, textTransform: "uppercase", fontFamily: "'Space Mono',monospace" }}>
                    {t('cont', lang)}
                  </button>
                )}
              </>)}

              {/* SUBMIT */}
              {gameState === "submit" && (<>
                <div style={{ fontSize: "clamp(16px,4vw,24px)", fontWeight: 700, color: "#a855f7", letterSpacing: 4, marginBottom: 20 }}>{t('enterName', lang)}</div>
                <input
                  type="text" maxLength={16} value={playerName}
                  onChange={(e) => { setPlayerName(e.target.value); setSubmitStatus(""); }}
                  onBlur={(e) => setPlayerName(e.target.value.toUpperCase())}
                  onKeyDown={(e) => { if (e.key === 'Enter' && !submittingRef.current) handleSubmitScore(); }}
                  placeholder="ANON" autoFocus
                  style={{
                    background: "rgba(255,255,255,0.05)",
                    border: "1px solid " + (nameShake ? "rgba(255,48,80,0.8)" : "rgba(168,85,247,0.3)"),
                    color: "#fff", padding: "10px 20px", fontSize: "clamp(14px,3vw,18px)",
                    letterSpacing: 3, textAlign: "center", outline: "none",
                    fontFamily: "'Space Mono',monospace", width: "min(280px, 70vw)", borderRadius: 0,
                    textTransform: "uppercase",
                    animation: nameShake ? "nameShake 0.5s ease-out" : "none",
                  }}
                />
                <div style={{ fontSize: "clamp(22px,6vw,40px)", fontWeight: 700, color: "#fff", margin: "16px 0 4px" }}>{score.toLocaleString()}</div>
                <div style={{ fontSize: "clamp(9px,2vw,11px)", color: "#555", letterSpacing: 2, marginBottom: 20 }}>{levelString(lv)}</div>
                {submitStatus && (
                  <div style={{
                    fontSize: "clamp(10px,2vw,13px)",
                    color: submitStatus.includes("not allowed") ? "#ff3050" : submitStatus.startsWith("Rank") ? "#a855f7" : "#555",
                    letterSpacing: 2, marginBottom: 12,
                  }}>{submitStatus}</div>
                )}
                <div style={{ display: "flex", gap: 12, flexWrap: "wrap", justifyContent: "center" }}>
                  <button onClick={handleSubmitScore} disabled={isSubmitting} style={{
                    background: "none", border: "1px solid " + (isSubmitting ? "rgba(85,85,85,0.3)" : "rgba(168,85,247,0.4)"),
                    color: isSubmitting ? "#555" : "#a855f7", padding: "10px 40px", fontSize: "clamp(12px,3vw,16px)",
                    letterSpacing: 4, cursor: isSubmitting ? "default" : "pointer", borderRadius: 0,
                    textTransform: "uppercase", fontFamily: "'Space Mono',monospace",
                    opacity: isSubmitting ? 0.5 : 1,
                  }}>{isSubmitting ? "..." : t('submit', lang)}</button>
                  <button onClick={() => setGameState("menu")} style={{
                    background: "none", border: "1px solid rgba(255,255,255,0.15)",
                    color: "rgba(255,255,255,0.4)", padding: "10px 30px", fontSize: "clamp(11px,2.5vw,14px)",
                    letterSpacing: 3, cursor: "pointer", borderRadius: 0,
                    textTransform: "uppercase", fontFamily: "'Space Mono',monospace",
                  }}>{t('cancel', lang)}</button>
                </div>
              </>)}
            </div>
          )}

          {/* Version */}
          <div style={{
            position: "absolute", bottom: "max(8px, 1.5vh)", left: 0, right: 0,
            textAlign: "center", color: "#fff",
            fontSize: "clamp(8px, 1.5vw, 10px)", letterSpacing: 2,
            zIndex: 2, pointerEvents: "none",
          }}>v0.5.4b</div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<TheHole />);
  </script>
</body>
</html>
